# Redis Configuration for Monad Analytics
# Allow container network connections only
bind 0.0.0.0

# Enable protected mode but allow container network access
protected-mode yes
# Set a simple password for additional security
requirepass monad_redis_pass

# Persistence and memory settings
appendonly yes
maxmemory 1gb
maxmemory-policy allkeys-lru

# CRITICAL: Disable replication commands to prevent slave mode
rename-command SLAVEOF ""
rename-command REPLICAOF "" 