# Redis Configuration for Monad Analytics
# Only allow local connections
bind 127.0.0.1

# Enable protected mode for security
protected-mode yes

# Persistence and memory settings
appendonly yes
maxmemory 1gb
maxmemory-policy allkeys-lru

# CRITICAL: Disable replication commands to prevent slave mode
rename-command SLAVEOF ""
rename-command REPLICAOF "" 