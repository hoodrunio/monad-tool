services:
  db:
    image: postgres:15
    container_name: monad-explorer-db-secure
    environment:
      POSTGRES_DB: ${DB_NAME:-squid}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER:-squid_user}
      # Güvenlik için ek ayarlar
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # SADECE localhost'a bind edin - internet'e kapalı
      - "${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      # Data persistence için
      - postgres_secure_data:/var/lib/postgresql/data
    # Use optimized inline configuration that was working
    command: ["postgres", "-c", "shared_buffers=4GB", "-c", "effective_cache_size=8GB", "-c", "work_mem=128MB", "-c", "maintenance_work_mem=512MB", "-c", "max_connections=100", "-c", "checkpoint_completion_target=0.7"]
    # Güvenlik ayarları (increased for performance)
    shm_size: 4gb
    restart: unless-stopped
    # Güvenlik: container'ı read-only yapın (data volume hariç)
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # Resource limits (increased for optimized config)
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
    # Network güvenliği
    networks:
      - monad-explorer-network
    # Health check
    #healthcheck:
      #test: ["CMD-SHELL", "pg_isready -U squid_user -d squid"]
      #interval: 30s
      #timeout: 10s
      #retries: 3
      #start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: monad-explorer-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - monad-explorer-network

  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: monad-explorer-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "${RABBITMQ_UI_PORT:-15672}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    networks:
      - monad-explorer-network

  clickhouse:
    image: clickhouse/clickhouse-server:23.8
    container_name: monad-explorer-clickhouse
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-monad_explorer}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    networks:
      - monad-explorer-network

  cold-storage-worker:
    image: node:20
    container_name: monad-explorer-cold-storage-worker
    working_dir: /app
    command: sh -c "npm install && npm run worker:cold-storage"
    volumes:
      - ./:/app
    environment:
      ENABLE_COLD_STORAGE: "true"
      STORAGE_ROUTING_MODE: ${STORAGE_ROUTING_MODE:-dual-write}
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-monad_explorer}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      RABBITMQ_URL: amqp://rabbitmq:5672
      INTERNAL_REDIS_HOST: redis
      INTERNAL_REDIS_PORT: 6379
      REDIS_HOST: ${INTERNAL_REDIS_HOST:-redis}
      REDIS_PORT: ${INTERNAL_REDIS_PORT:-6379}
    depends_on:
      - rabbitmq
      - clickhouse
    restart: unless-stopped
    networks:
      - monad-explorer-network
    profiles:
      - cold-storage

  hot-storage-pruner:
    image: node:20
    container_name: monad-explorer-hot-storage-pruner
    working_dir: /app
    command: sh -c "npm install && npm run worker:pruner"
    volumes:
      - ./:/app
    environment:
      ENABLE_HOT_PRUNING: "true"
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-squid_user}
      DB_PASS: ${DB_PASS:-postgres}
      DB_NAME: ${DB_NAME:-squid}
      INTERNAL_REDIS_HOST: redis
      INTERNAL_REDIS_PORT: 6379
      REDIS_HOST: ${INTERNAL_REDIS_HOST:-redis}
      REDIS_PORT: ${INTERNAL_REDIS_PORT:-6379}
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - monad-explorer-network
    profiles:
      - cold-storage

volumes:
  postgres_secure_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  clickhouse_data:
    driver: local

networks:
  monad-explorer-network:
    driver: bridge
    # internal: true  # Bu satırı kaldırdık - local erişim için gerekli
