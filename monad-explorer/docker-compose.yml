services:
  db:
    image: postgres:15
    container_name: monad-explorer-db-secure
    environment:
      POSTGRES_DB: ${DB_NAME:-squid}
      POSTGRES_PASSWORD: ${DB_PASS}
      POSTGRES_USER: ${DB_USER:-squid_user}
      # Güvenlik için ek ayarlar
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --lc-collate=C --lc-ctype=C"
    ports:
      # SADECE localhost'a bind edin - internet'e kapalı
      - "${DB_HOST:-127.0.0.1}:${DB_PORT:-5432}:5432"
    volumes:
      # Data persistence için
      - postgres_secure_data:/var/lib/postgresql/data
    # Use optimized inline configuration that was working
    command: ["postgres", "-c", "shared_buffers=4GB", "-c", "effective_cache_size=8GB", "-c", "work_mem=128MB", "-c", "maintenance_work_mem=512MB", "-c", "max_connections=100", "-c", "checkpoint_completion_target=0.7"]
    # Güvenlik ayarları (increased for performance)
    shm_size: 4gb
    restart: unless-stopped
    # Güvenlik: container'ı read-only yapın (data volume hariç)
    read_only: true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    # Resource limits (increased for optimized config)
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: '4.0'
    # Network güvenliği
    networks:
      - monad-explorer-network
    # Health check
    #healthcheck:
      #test: ["CMD-SHELL", "pg_isready -U squid_user -d squid"]
      #interval: 30s
      #timeout: 10s
      #retries: 3
      #start_period: 30s

volumes:
  postgres_secure_data:
    driver: local

networks:
  monad-explorer-network:
    driver: bridge
    # internal: true  # Bu satırı kaldırdık - local erişim için gerekli