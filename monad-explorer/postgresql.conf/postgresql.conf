# PostgreSQL Optimized Configuration for Monad Explorer
# Optimized for high-throughput blockchain data processing

# -----------------------------------------------------------------------------
# CONNECTIONS AND AUTHENTICATION
# -----------------------------------------------------------------------------

# Connection settings optimized for multiple workers + main processor (20GB server)
max_connections = 400                    # Increased for high-performance server
superuser_reserved_connections = 5

# Authentication
authentication_timeout = 60s

# -----------------------------------------------------------------------------
# RESOURCE USAGE (MEMORY)
# -----------------------------------------------------------------------------

# Memory settings for 20GB server (optimized for high-throughput blockchain processing)
shared_buffers = 5GB                     # 25% of total RAM (20GB * 0.25)
effective_cache_size = 15GB              # 75% of total RAM for PostgreSQL + OS cache  
work_mem = 128MB                         # Per-operation memory for sorting/hashing (increased)
maintenance_work_mem = 1GB               # For VACUUM, CREATE INDEX, etc. (increased)
dynamic_shared_memory_type = posix

# Huge pages (if available)
huge_pages = try

# -----------------------------------------------------------------------------
# WRITE AHEAD LOG (WAL) - Critical for Performance
# -----------------------------------------------------------------------------

# WAL settings optimized for high-throughput inserts (20GB server)
wal_level = replica                      # Required for replication
wal_buffers = 64MB                       # WAL buffer size (increased for high RAM)
wal_writer_delay = 50ms                  # WAL writer frequency (faster)
wal_compression = on                     # Compress WAL records

# Checkpoint settings - critical for insert performance (high-performance)
checkpoint_timeout = 20min              # Checkpoint frequency (longer for stability)
max_wal_size = 4GB                       # Maximum WAL size before checkpoint (increased)
min_wal_size = 2GB                       # Minimum WAL size to keep (increased)
checkpoint_completion_target = 0.9       # Spread checkpoint I/O over 90% of interval
checkpoint_warning = 30s                 # Warn if checkpoints are too frequent

# Archive settings (disabled for performance)
archive_mode = off

# -----------------------------------------------------------------------------
# QUERY TUNING
# -----------------------------------------------------------------------------

# Cost-based optimizer settings
seq_page_cost = 1.0                     # Sequential page read cost
random_page_cost = 1.1                   # Random page read cost (SSD optimized)
cpu_tuple_cost = 0.01                    # CPU cost per tuple
cpu_index_tuple_cost = 0.005             # CPU cost per index tuple
cpu_operator_cost = 0.0025               # CPU cost per operator

# Query planning
default_statistics_target = 100          # Statistics accuracy
constraint_exclusion = partition         # Enable constraint exclusion for partitions
from_collapse_limit = 12                 # Subquery flattening limit
join_collapse_limit = 12                 # Join planning limit

# -----------------------------------------------------------------------------
# BACKGROUND WRITER - Important for Bulk Inserts
# -----------------------------------------------------------------------------

# Background writer settings for high insert workloads
bgwriter_delay = 100ms                   # Background writer sleep time
bgwriter_lru_maxpages = 200              # Max pages to write per round
bgwriter_lru_multiplier = 4.0            # Pages to write as fraction of new pages
bgwriter_flush_after = 0                 # Force OS flush (disabled for performance)

# -----------------------------------------------------------------------------
# ASYNCHRONOUS BEHAVIOR
# -----------------------------------------------------------------------------

# Async settings (optimized for 6 core/11 thread server)
effective_io_concurrency = 400           # Concurrent I/O operations (high-performance)
max_worker_processes = 16                # Maximum background processes (increased)
max_parallel_workers_per_gather = 8      # Parallel workers per query (increased)
max_parallel_workers = 16                # Total parallel workers (increased)
max_parallel_maintenance_workers = 8     # Parallel maintenance workers (increased)

# -----------------------------------------------------------------------------
# ERROR REPORTING AND LOGGING
# -----------------------------------------------------------------------------

# Logging for production monitoring
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# Log levels for performance monitoring
log_min_duration_statement = 5000        # Log slow queries (5+ seconds)
log_checkpoints = on                     # Log checkpoint activity
log_connections = off                    # Disable connection logging for performance
log_disconnections = off                 # Disable disconnection logging for performance
log_lock_waits = on                      # Log lock waits
log_statement = 'none'                   # Don't log all statements (performance)
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# -----------------------------------------------------------------------------
# AUTOVACUUM - Critical for Long-Running Blockchain Processing
# -----------------------------------------------------------------------------

# Autovacuum settings optimized for high-insert workloads (20GB server)
autovacuum = on
log_autovacuum_min_duration = 0          # Log all autovacuum activity
autovacuum_max_workers = 8               # Increased for high-performance server
autovacuum_naptime = 20s                 # More frequent autovacuum runs (faster)
autovacuum_vacuum_threshold = 25         # Vacuum threshold
autovacuum_vacuum_scale_factor = 0.1     # 10% table size threshold
autovacuum_analyze_threshold = 25        # Analyze threshold  
autovacuum_analyze_scale_factor = 0.05   # 5% table size threshold
autovacuum_freeze_max_age = 200000000    # Anti-wraparound vacuum
autovacuum_multixact_freeze_max_age = 400000000
autovacuum_vacuum_cost_delay = 10ms      # Reduced delay for faster vacuum
autovacuum_vacuum_cost_limit = 400       # Increased cost limit

# -----------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
# -----------------------------------------------------------------------------

# Client connection settings
search_path = '"$user", public'
default_tablespace = ''
temp_tablespaces = ''
check_function_bodies = on
default_transaction_isolation = 'read committed'
default_transaction_read_only = off
default_transaction_deferrable = off
session_replication_role = 'origin'
statement_timeout = 0                    # No statement timeout
lock_timeout = 0                         # No lock timeout
idle_in_transaction_session_timeout = 0  # No idle timeout
tcp_keepalives_idle = 600               # TCP keepalive
tcp_keepalives_interval = 30
tcp_keepalives_count = 3

# -----------------------------------------------------------------------------
# LOCK MANAGEMENT
# -----------------------------------------------------------------------------

# Lock settings for concurrent processing
deadlock_timeout = 1s                   # Deadlock detection delay
max_locks_per_transaction = 64           # Locks per transaction
max_pred_locks_per_transaction = 64      # Predicate locks per transaction

# -----------------------------------------------------------------------------
# VERSION AND PLATFORM COMPATIBILITY
# -----------------------------------------------------------------------------

# Platform-specific optimizations
shared_preload_libraries = ''           # No additional libraries for now
timezone = 'UTC'                        # Use UTC for blockchain data
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8' 
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# JIT settings (PostgreSQL 11+)
jit = off                               # Disable JIT for consistent performance

# -----------------------------------------------------------------------------
# CUSTOM SETTINGS FOR BLOCKCHAIN WORKLOADS
# -----------------------------------------------------------------------------

# Synchronous commit settings for performance
synchronous_commit = off                # Async commit for better performance
wal_sync_method = fdatasync             # Sync method
full_page_writes = on                   # Required for crash safety
wal_log_hints = off                     # Disable for performance

# Stats settings
track_activities = on
track_counts = on
track_io_timing = on                    # Track I/O timing
track_functions = none                  # Don't track functions for performance

# Planner settings for analytical queries
enable_bitmapscan = on
enable_hashagg = on
enable_hashjoin = on
enable_indexscan = on
enable_indexonlyscan = on
enable_material = on
enable_mergejoin = on
enable_nestloop = on
enable_seqscan = on
enable_sort = on
enable_tidscan = on 