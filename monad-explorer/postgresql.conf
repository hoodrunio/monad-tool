# PostgreSQL Configuration for Monad Explorer
# Optimized for: 20GB RAM, 6 cores/11 threads
# Target: High-performance blockchain data processing

# ========================================
# MEMORY CONFIGURATION
# ========================================

# 25% of total RAM for shared buffers (5GB)
shared_buffers = 5GB

# 75% of total RAM for effective cache (15GB)
effective_cache_size = 15GB

# Work memory per connection (32MB per operation)
# With max_connections=100: 32MB * 100 = 3.2GB max
work_mem = 32MB

# Maintenance work memory for vacuum, index creation (1GB)
maintenance_work_mem = 1GB

# Temporary file limit per session (2GB)
temp_file_limit = 2GB

# ========================================
# CONNECTION CONFIGURATION
# ========================================

# Connection limits optimized for batch processing
max_connections = 100
superuser_reserved_connections = 3

# Connection pooling settings
tcp_keepalives_idle = 600
tcp_keepalives_interval = 30
tcp_keepalives_count = 3

# ========================================
# WAL CONFIGURATION
# ========================================

# WAL level for performance
wal_level = replica

# WAL buffers (16MB)
wal_buffers = 16MB

# Checkpoint settings for bulk inserts
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 4GB
min_wal_size = 1GB

# Synchronous commit (disabled for performance)
synchronous_commit = off

# WAL writer settings
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# ========================================
# QUERY PLANNER CONFIGURATION
# ========================================

# Random page cost (SSD optimized)
random_page_cost = 1.1

# Sequential scan preference
seq_page_cost = 1.0

# CPU settings
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# Effective IO concurrency (number of cores)
effective_io_concurrency = 6

# ========================================
# PARALLEL PROCESSING
# ========================================

# Parallel worker settings
max_parallel_workers_per_gather = 4
max_parallel_workers = 6
max_parallel_maintenance_workers = 4
max_worker_processes = 11

# Parallel query thresholds
min_parallel_table_scan_size = 8MB
min_parallel_index_scan_size = 512kB

# ========================================
# BACKGROUND WRITER CONFIGURATION
# ========================================

# Background writer for smooth performance
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = 512kB

# ========================================
# VACUUM & AUTOVACUUM CONFIGURATION
# ========================================

# Autovacuum settings for high-insert workload
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

# Autovacuum thresholds for heavy insert workload
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05

# Vacuum cost settings (aggressive for performance)
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 2000

# ========================================
# LOGGING CONFIGURATION
# ========================================

# Logging level
log_min_duration_statement = 1000
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on

# Query logging for slow queries
log_statement = 'none'
log_line_prefix = '%t [%p-%l] %q%u@%d '

# ========================================
# LOCK CONFIGURATION
# ========================================

# Lock settings for concurrent processing
max_locks_per_transaction = 256
max_pred_locks_per_transaction = 128

# Deadlock timeout
deadlock_timeout = 1s
lock_timeout = 30s

# ========================================
# BULK LOADING OPTIMIZATIONS
# ========================================

# Increase for bulk inserts
max_wal_senders = 0
archive_mode = off

# Fsync settings (risky but fast)
fsync = on
full_page_writes = on

# ========================================
# STATISTICS CONFIGURATION
# ========================================

# Statistics settings
track_activities = on
track_counts = on
track_io_timing = on
track_functions = none

# Statistics targets
default_statistics_target = 100

# ========================================
# NETWORK CONFIGURATION
# ========================================

# Listen settings
listen_addresses = 'localhost'
port = 5432

# SSL disabled for local connections
ssl = off

# ========================================
# CLIENT CONNECTION DEFAULTS
# ========================================

# Time zone
timezone = 'UTC'

# Locale settings
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Other defaults
default_text_search_config = 'pg_catalog.english' 