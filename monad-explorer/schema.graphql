# Blockchain Explorer Schema for Monad

type Block @entity {
  id: ID! # block hash
  number: Int! @index
  hash: String! @unique
  parentHash: String!
  timestamp: DateTime! @index
  size: BigInt
  gasLimit: BigInt!
  gasUsed: BigInt!
  transactionCount: Int!
  miner: String
  extraData: String
  baseFeePerGas: BigInt
}

type Transaction @entity {
  id: ID! # transaction hash
  hash: String! @unique @index
  block: Block!
  transactionIndex: Int!
  fromAddress: String! @index
  toAddress: String @index
  value: BigInt!
  gas: BigInt!
  gasPrice: BigInt!
  gasUsed: BigInt
  input: String
  status: Int
  error: String
  revertReason: String
  timestamp: DateTime! @index
  nonce: BigInt
  type: Int
  effectiveGasPrice: BigInt
  maxFeePerGas: BigInt
  maxPriorityFeePerGas: BigInt
  contractAddress: String
  cumulativeGasUsed: BigInt
  transactionFee: BigInt
  methodName: String
  methodID: String
  inputDecoded: String
  isContractInteraction: Boolean!
  isContractCreation: Boolean!
}

type Account @entity {
  id: ID! # address
  address: String! @unique @index
  balance: BigInt!
  transactionCount: Int!
  isContract: Boolean! @index
  contractCode: String
  createdAt: DateTime
  contractType: String
  isVerified: Boolean
  contractName: String
  ensName: String
}

type Log @entity {
  id: ID! # transaction hash + log index
  transaction: Transaction!
  logIndex: Int!
  address: String! @index
  topics: [String!]!
  data: String!
  removed: Boolean
}

type InternalTransaction @entity {
  id: ID! # transaction hash + trace index
  transaction: Transaction!
  traceIndex: Int!
  type: String!
  fromAddress: String! @index
  toAddress: String @index
  value: BigInt!
  gas: BigInt!
  gasUsed: BigInt!
  input: String
  output: String
  error: String
  parentTrace: InternalTransaction
}

type Token @entity {
  id: ID! # contract address
  address: String! @unique @index
  name: String
  symbol: String @index
  decimals: Int
  totalSupply: BigInt
  tokenType: TokenType! @index
  createdAt: DateTime!
  enrichmentStatus: TokenEnrichmentStatus! @index
  enrichedAt: DateTime
  enrichmentAttempts: Int!
}

# TokenTransfer removed - now computed at runtime from logs via TransactionService

type TokenBalance @entity {
  id: ID! # account address + token address
  account: Account!
  token: Token!
  balance: BigInt!
  lastUpdated: DateTime!
}

type Contract @entity {
  id: ID! # contract address
  address: String! @unique @index
  creator: String @index
  owner: String @index
  creationTransaction: Transaction!
  createdAt: DateTime! @index
  bytecode: String
  sourceCode: String
  isVerified: Boolean! @index
  name: String
  compilerVersion: String
}

type DailyStats @entity {
  id: ID! # date (YYYY-MM-DD)
  date: DateTime! @unique @index
  blockCount: Int!
  transactionCount: Int!
  uniqueAddresses: Int!
  totalGasUsed: BigInt!
  averageGasPrice: BigInt!
  totalValue: BigInt!
}

type MethodSignature @entity {
  id: ID! # method ID (first 4 bytes)
  methodId: String! @unique @index
  signature: String!
  name: String! @index
  verified: Boolean!
  source: String
}

enum TokenType {
  ERC20
  ERC721
  ERC1155
  UNKNOWN
}

enum TokenEnrichmentStatus {
  PENDING
  ENRICHED
  FAILED
}
